<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面已迁移 · CodeForFun</title>
<style>
  :root{--bg:#f5f6f4;--panel:#fff;--line:#e7e9e3;--text:#33372f;--muted:#91968d;--accent:#5f8270;--deep:#4a6557}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:34px 32px;max-width:520px;width:100%;box-shadow:0 8px 24px rgba(50,60,50,.06);text-align:center}
  .ico{width:52px;height:52px;border-radius:14px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:linear-gradient(135deg,var(--accent),var(--deep));color:#fff}
  h1{font-size:19px;margin:0 0 8px;letter-spacing:.3px}
  p{color:var(--muted);font-size:13.5px;margin:0 0 6px;line-height:1.7}
  .path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--deep);
    background:#f0f3ef;border-radius:5px;padding:3px 7px;word-break:break-all;display:inline-block;margin:8px 0}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  a.btn{display:inline-block;padding:9px 20px;border-radius:8px;font-size:13.5px;text-decoration:none;
    background:var(--deep);color:#fff;transition:.15s}
  a.btn.ghost{background:transparent;color:var(--deep);border:1px solid var(--line)}
  a.btn:hover{opacity:.88}
  .tip{margin-top:18px;font-size:12px;color:#b0b4ab}
</style>
</head>
<body>
<div class="box">
  <div class="ico">↗</div>
  <h1 id="title">这个地址已经搬家</h1>
  <p id="msg">仓库里的文件全部改成了中文名，正在帮你转到新地址…</p>
  <div class="path" id="from"></div>
  <div class="btns">
    <a class="btn" id="go" href="/CodeForFun/">前往新地址</a>
    <a class="btn ghost" href="/CodeForFun/">返回目录</a>
  </div>
  <div class="tip">旧链接自动跳转，无需手动修改收藏夹</div>
</div>

<script>
(function(){
  "use strict";
  var BASE = "/CodeForFun";

  /* 第一代英文文件名 → 现中文路径 */
  var MAP = {
    "bilello-20-rules.html": "比莱洛20条投资法则精读.html",
    "wms-validation-alert-spec.html": "雪花WMS校验与告警规范.html",
    "gjj-base-limit-top20.html": "公积金缴存基数上下限20城.html",
    "gjj-collection-top20.html": "公积金缴存额20城.html",
    "gjj-coverage-top20.html": "公积金缴存人数覆盖率20城.html",
    "gjj-loan-2026.html": "公积金贷款2026年度20城.html",
    "gjj-overview-top20.html": "公积金全景总卡20城.html",
    "gjj-purchase-power-top20.html": "公积金购房支撑力20城.html",
    "gjj-utilization-ratio.html": "公积金个贷率20城.html",
    "calendar/habanada-laibin-calendar.html": "种植日历/哈巴纳达广西来宾种植日历.html",
    "calendar/habanada-ningbo-calendar.html": "种植日历/哈巴纳达浙江宁波种植日历.html",
    "recipes/beihai-2bed.html": "研究/北海两居室选房推荐.html",
    "recipes/beihai-vs-chunxiao.html": "研究/北海对比宁波春晓梅山.html",
    "recipes/city-population-housing.html": "研究/四城人口结构与房价验证.html",
    "recipes/coastal-living-hub.html": "研究/沿海旅居决策合集.html",
    "recipes/competitor-benchmark.html": "研究/城经笔记竞品对标卡.html",
    "recipes/competitor-deep.html": "研究/竞品深度拆解.html",
    "recipes/habanada-recipe.html": "研究/哈巴纳达食用指南.html",
    "recipes/jalapeno-varieties.html": "研究/哈拉佩纽品种图鉴.html",
    "recipes/pension-ningbo-calc.html": "研究/宁波养老金测算.html"
  };

  /* 第二代：中文文件名 + 英文目录名 → 目录名换成中文 */
  var DIR = { "calendar": "种植日历", "recipes": "研究", "components": "组件" };

  function raw(){
    var p = location.pathname;
    if (p.indexOf(BASE + "/") === 0) p = p.slice(BASE.length + 1);
    else p = p.replace(/^\/+/, "");
    try { return decodeURIComponent(p); } catch(e){ return p; }
  }

  function resolve(p){
    if (MAP[p]) return MAP[p];
    if (!p || p.charAt(p.length - 1) === "/") return "";
    var seg = p.split("/");
    if (seg.length > 1 && DIR[seg[0]]) {
      seg[0] = DIR[seg[0]];
      return seg.join("/");
    }
    return "";
  }

  var here = raw();
  var target = resolve(here);

  document.getElementById("from").textContent = "/" + here;

  if (target) {
    var url = BASE + "/" + encodeURI(target);
    document.getElementById("go").href = url;
    document.getElementById("msg").textContent = "仓库里的文件全部改成了中文名，正在转到新地址…";
    setTimeout(function(){ location.replace(url); }, 700);
  } else {
    document.getElementById("title").textContent = "没有找到这个页面";
    document.getElementById("msg").textContent = "地址可能输错了，或者这个文件已经不在了。";
    document.getElementById("go").textContent = "回到目录";
  }
})();
</script>
</body>
</html>

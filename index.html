<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForFun · 单文件 HTML 目录</title>
<style>
  :root{
    --bg:#f5f6f4; --bg2:#fafbfa; --panel:#ffffff; --card:#f1f3f0; --line:#e7e9e3;
    --text:#33372f; --muted:#91968d;
    --accent:#5f8270; --accent2:#84a892; --accent-deep:#4a6557;
    --shadow:0 8px 24px rgba(50,60,50,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
  header{flex:0 0 auto;padding:16px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;background:var(--bg2)}
  .logo{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:19px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));box-shadow:0 3px 10px rgba(74,101,87,.18)}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header h1 b{color:var(--accent-deep)}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .count{margin-left:auto;color:var(--accent-deep);font-size:13px;border:1px solid var(--line);
    padding:5px 12px;border-radius:20px;background:var(--panel)}

  .layout{flex:1 1 auto;display:grid;grid-template-columns:240px 1fr;min-height:0}

  /* 侧栏：分类 + 搜索 */
  .sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
  .cats{padding:12px 12px 6px;display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:5px 11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:16px;font-size:12px;cursor:pointer;transition:.14s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .search{padding:10px 12px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:9px;font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .hint{padding:8px 14px;color:var(--muted);font-size:11px;line-height:1.5;border-top:1px solid var(--line);margin-top:auto}
  .hint code{background:var(--card);padding:1px 5px;border-radius:4px;color:var(--accent-deep)}

  /* 主区 */
  .main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .bar{flex:0 0 auto;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
  .bar .name{font-size:14px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .name b{color:var(--accent-deep)}
  .bar .sp{flex:1}
  .btn{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--text);text-decoration:none;transition:.14s;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:var(--accent-deep);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.05)}

  .toolbar{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--panel);color:var(--muted);padding:7px 14px;font-size:13px;cursor:pointer;transition:.14s}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff}
  .toolbar .sp{flex:1}
  .toolbar label{font-size:12px;color:var(--muted)}
  .toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 8px;font-size:13px;outline:none}
  .toolbar select:focus{border-color:var(--accent)}

  .stage{flex:1;display:flex;min-height:0}
  .browse{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .browse.view-list .list{display:block}
  .browse.view-list .grid{display:none}
  .browse.view-grid .list{display:none}
  .browse.view-grid .grid{display:grid}
  .list{flex:1;overflow-y:auto;padding:8px}

  .item{padding:11px 12px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
    border:1px solid transparent;transition:.14s}
  .item:hover{background:var(--card)}
  .item.active{background:var(--card);border-color:var(--accent-deep);box-shadow:inset 3px 0 0 var(--accent)}
  .item .fi{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(95,130,112,.16),rgba(74,101,87,.08));font-size:15px}
  .item .meta{min-width:0}
  .item .t{font-size:14px;line-height:1.35;color:var(--text);word-break:break-word}
  .item .f{font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all}
  .empty{color:var(--muted);text-align:center;padding:30px 12px;font-size:13px}

  .grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-content:start}
  .thumb{cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;transition:.14s;display:flex;flex-direction:column}
  .thumb:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .thumb.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(95,130,112,.3)}
  .thumb iframe{width:100%;height:150px;border:0;pointer-events:none;background:#fff;display:block}
  .thumb .cap{padding:9px 11px;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
  .thumb .cap .f{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}

  /* 预览面板（默认隐藏） */
  .viewer{flex:0 0 44%;max-width:720px;min-height:0;background:#fff;display:none;flex-direction:column;border-left:1px solid var(--line)}
  .viewer iframe{width:100%;height:100%;border:0;display:block;flex:1}
  .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px}
  .placeholder .big{font-size:46px;opacity:.45}

  /* 放大弹窗 */
  .modal{position:fixed;inset:0;background:rgba(40,46,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal-box{width:92vw;height:88vh;max-width:1100px;background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{flex:0 0 auto;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
  .modal-head .mt{font-size:14px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-head .mt b{color:var(--accent-deep)}
  .modal-head .sp{flex:1}
  .modal-frame{flex:1;width:100%;border:0;display:block;background:#fff}

  footer{flex:0 0 auto;text-align:center;color:var(--muted);font-size:11px;padding:8px;border-top:1px solid var(--line);background:var(--bg2)}
  a.link{color:var(--accent-deep);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-deep)}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .sidebar{max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
    .stage{flex-direction:column}
    .viewer{border-left:none;border-top:1px solid var(--line);min-height:55vh}
  }
</style>
</head>
<body>
<header>
  <div class="logo">📁</div>
  <div>
    <h1>CodeForFun · <b>单文件 HTML 目录</b></h1>
    <div class="sub">按真实子目录归类 · 仓库内所有单文件 HTML 集中预览</div>
  </div>
  <div class="count" id="count">0 个文件</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="cats" id="cats"></div>
    <div class="search"><input id="q" placeholder="搜索文件名 / 标题…" oninput="render()"></div>
    <div class="hint">分类按文件所在的<b>真实子目录</b>自动生成：<code>calendar/</code>→日历、<code>components/</code>→组件、根目录→根目录。预览区点「⛶ 放大」可全屏展示（不跳新标签）。</div>
  </aside>

  <section class="main">
    <div class="bar">
      <div class="name" id="barName">未选择文件</div>
      <div class="sp"></div>
      <button class="btn" id="zoomBtn" onclick="zoomActive()" style="display:none">⛶ 放大</button>
      <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" style="display:none">新标签打开</a>
      <button class="btn primary" id="closeBtn" onclick="closePreview()" style="display:none">关闭预览</button>
    </div>
    <div class="toolbar">
      <div class="seg">
        <button data-v="list" class="on" onclick="setView('list')">⊞ 列表</button>
        <button data-v="grid" onclick="setView('grid')">▦ 缩略图</button>
      </div>
      <div class="sp"></div>
      <label for="sort">排序</label>
      <select id="sort" onchange="setSort(this.value)">
        <option value="name">名称</option>
        <option value="time">最近更新</option>
      </select>
      <div class="sp"></div>
      <button class="btn" id="toggleBtn" onclick="toggleViewer()">预览</button>
    </div>
    <div class="stage">
      <div class="browse view-list" id="browse">
        <div class="list" id="listView"></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="viewer" id="viewer">
        <div class="placeholder" id="ph">
          <div class="big">🗂️</div>
          <div>点击左侧文件或「预览」按钮开始查看</div>
        </div>
        <iframe id="frame" src="about:blank" style="display:none"></iframe>
      </div>
    </div>
  </section>
</div>

<!-- 缩略图放大弹窗 -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <div class="mt" id="mTitle">预览</div>
      <div class="sp"></div>
      <a class="btn" id="mOpen" href="#" target="_blank" rel="noopener">新标签打开</a>
      <button class="btn primary" onclick="closeModal()">关闭 ✕</button>
    </div>
    <iframe class="modal-frame" id="mFrame" src="about:blank"></iframe>
  </div>
</div>

<footer>
  数据来源：GitHub API（<a class="link" href="https://github.com/dengdasam/CodeForFun" target="_blank" rel="noopener">dengdasam/CodeForFun</a>）。新增 .html 会自动出现在列表并归入对应子目录。
</footer>

<script>
const REPO = "dengdasam/CodeForFun";
const BRANCH = "main";
const TREE_API = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
const FALLBACK = [
  {path:"calendar/habanada-laibin-calendar.html", title:"哈巴纳达 · 来宾种植日历"},
  {path:"calendar/habanada-ningbo-calendar.html", title:"哈巴纳达 · 宁波种植日历"},
  {path:"components/数值输入框组件.html",          title:"数值输入框组件"}
];
const TITLE_MAP = {
  "habanada-laibin-calendar.html":"哈巴纳达 · 来宾种植日历",
  "habanada-ningbo-calendar.html":"哈巴纳达 · 宁波种植日历",
  "数值输入框组件.html":"数值输入框组件"
};
let DATA = [];
let active = null;
let view = "list";
let sort = "name";
let catFilter = "all";
let viewerClosed = true;

function baseName(p){ return p.split("/").pop(); }
function humanize(name){
  if(TITLE_MAP[name]) return TITLE_MAP[name];
  return name.replace(/\.html?$/i,"").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function enc(p){ return encodeURIComponent(p); }
function catOf(path){ return path.includes("/") ? path.split("/").slice(0,-1).join("/") : "根目录"; }

async function fetchTime(path){
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${enc(path)}&per_page=1`,
      {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) return null;
    const j = await r.json();
    return j[0]?.commit?.committer?.date || j[0]?.commit?.author?.date || null;
  }catch(e){ return null; }
}

async function load(){
  try{
    const r = await fetch(TREE_API, {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const blobs = (j.tree||[]).filter(n => n.type==="blob" && /\.html?$/i.test(n.path) && baseName(n.path).toLowerCase()!=="index.html");
    DATA = blobs.map(b=>{
      const name = baseName(b.path);
      return {path:b.path, name, title:TITLE_MAP[name]||humanize(name), size:b.size, cat:catOf(b.path), updated:null};
    });
    if(DATA.length===0) DATA = FALLBACK.map(f=>({...f, name:baseName(f.path), size:null, cat:catOf(f.path), updated:null}));
  }catch(e){ DATA = FALLBACK.map(f=>({...f, name:baseName(f.path), size:null, cat:catOf(f.path), updated:null})); }

  await Promise.all(DATA.map(d => fetchTime(d.path).then(t => d.updated = t)));

  document.getElementById("count").textContent = DATA.length + " 个文件";
  renderCats();
  render();
}

const CAT_LABEL = { "calendar":"日历", "components":"组件", "根目录":"根目录" };
function renderCats(){
  const cats = ["all", ...Array.from(new Set(DATA.map(d=>d.cat)))];
  const label = c => c==="all" ? "全部" : (CAT_LABEL[c] || c);
  document.getElementById("cats").innerHTML = cats.map(c=>
    `<button class="chip ${catFilter===c?'on':''}" onclick="setCat('${c}')">${label(c)}</button>`).join("");
}
function setCat(c){ catFilter = c; renderCats(); render(); }
function setView(v){ view = v; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); render(); }
function setSort(v){ sort = v; render(); }

function visibleItems(){
  const q = (document.getElementById("q").value||"").toLowerCase();
  let items = DATA.filter(d =>
    (catFilter==="all" || d.cat===catFilter) &&
    (d.name.toLowerCase().includes(q) || d.title.toLowerCase().includes(q)));
  items.sort((a,b)=>{
    if(sort==="time"){
      if(!a.updated) return 1; if(!b.updated) return -1;
      return new Date(b.updated) - new Date(a.updated);
    }
    return a.title.localeCompare(b.title, "zh");
  });
  return items;
}

function render(){
  const items = visibleItems();
  const listEl = document.getElementById("listView");
  const gridEl = document.getElementById("grid");

  if(items.length===0){
    const msg = `<div class="empty">没有匹配的文件</div>`;
    listEl.innerHTML = msg; gridEl.innerHTML = "";
    document.getElementById("browse").className = "browse " + (view==="grid"?"view-grid":"view-list");
    return;
  }

  const listHTML = items.map(d=>`
    <div class="item ${active===d.path?'active':''}" onclick="openFile('${enc(d.path)}')">
      <div class="fi">📄</div>
      <div class="meta">
        <div class="t">${d.title}</div>
        <div class="f">${d.path}${d.size?` · ${(d.size/1024).toFixed(1)} KB`:""}${d.updated?` · ${d.updated.slice(0,10)}`:""}</div>
      </div>
    </div>`).join("");

  const gridHTML = items.map(d=>`
    <div class="thumb ${active===d.path?'active':''}" onclick="openModal('${enc(d.path)}')">
      <iframe src="${d.path}" loading="lazy" title="${d.title}"></iframe>
      <div class="cap">
        <div class="t">${d.title}</div>
        <div class="f">${d.path}${d.updated?` · ${d.updated.slice(0,10)}`:""}</div>
      </div>
    </div>`).join("");

  listEl.innerHTML = listHTML;
  gridEl.innerHTML = gridHTML;
  document.getElementById("browse").className = "browse " + (view==="grid"?"view-grid":"view-list");
}

function openFile(href){
  active = decodeURIComponent(href);
  const d = DATA.find(x=>x.path===active);
  document.getElementById("barName").innerHTML = `当前：<b>${d?d.title:active}</b>`;
  document.getElementById("openBtn").href = active;
  document.getElementById("openBtn").style.display = "";
  document.getElementById("closeBtn").style.display = "";
  document.getElementById("zoomBtn").style.display = "";
  if(viewerClosed) toggleViewer();
  document.getElementById("ph").style.display = "none";
  const f = document.getElementById("frame");
  f.style.display = "block"; f.src = active;
  render();
}
function closePreview(){
  document.getElementById("ph").style.display = "flex";
  const f = document.getElementById("frame");
  f.style.display = "none"; f.src = "about:blank";
  toggleViewer(); // 收起预览面板
  document.getElementById("barName").textContent = "未选择文件";
  document.getElementById("openBtn").style.display = "none";
  document.getElementById("closeBtn").style.display = "none";
  document.getElementById("zoomBtn").style.display = "none";
  active = null;
  render();
}
function toggleViewer(){
  viewerClosed = !viewerClosed;
  const v = document.getElementById("viewer");
  v.style.display = viewerClosed ? "none" : "flex";
  const btn = document.getElementById("toggleBtn");
  btn.textContent = viewerClosed ? "预览" : "隐藏预览";
  btn.classList.toggle("primary", !viewerClosed);
}

/* 缩略图放大弹窗 */
function openModal(href){
  const path = decodeURIComponent(href);
  const d = DATA.find(x=>x.path===path);
  document.getElementById("mTitle").innerHTML = `预览：<b>${d?d.title:path}</b>`;
  document.getElementById("mOpen").href = path;
  document.getElementById("mFrame").src = path;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.getElementById("mFrame").src = "about:blank";
}
/* 预览面板「放大」：当前文件全屏展示，不跳转新标签 */
function zoomActive(){
  if(!active) return;
  openModal(encodeURIComponent(active));
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

load();
</script>
</body>
</html>

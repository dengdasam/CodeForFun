<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForFun · 单文件 HTML 目录</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171b2e; --card:#1e2440; --line:#2a3258;
    --text:#e8ebf5; --muted:#9aa3c4; --accent:#5b8cff; --accent2:#34d399;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:radial-gradient(1200px 600px at 80% -10%,#1b2350 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
  header{padding:34px 24px 10px;max-width:1080px;margin:0 auto}
  header h1{margin:0;font-size:26px;letter-spacing:.5px}
  header p{margin:8px 0 0;color:var(--muted);font-size:14px}
  .bar{max-width:1080px;margin:14px auto 0;padding:0 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--text);
            padding:11px 14px;border-radius:10px;font-size:14px;outline:none}
  .bar input:focus{border-color:var(--accent)}
  .meta{color:var(--muted);font-size:12px;padding:0 24px;max-width:1080px;margin:8px auto 0}
  .grid{max-width:1080px;margin:18px auto 60px;padding:0 24px;display:grid;
        grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
        display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:.18s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .ico{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
             display:flex;align-items:center;justify-content:center;font-size:20px}
  .card h3{margin:0;font-size:16px;line-height:1.4}
  .card .fn{color:var(--muted);font-size:12px;word-break:break-all}
  .card .acts{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1;text-align:center;padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer;
       border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;transition:.15s}
  .btn:hover{border-color:var(--accent);color:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  /* preview modal */
  .overlay{position:fixed;inset:0;background:rgba(6,8,18,.82);display:none;z-index:50;
           align-items:stretch;justify-content:center;padding:18px}
  .overlay.show{display:flex}
  .viewer{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:1100px;
          display:flex;flex-direction:column;overflow:hidden}
  .viewer .vhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  .viewer .vhead span{font-size:14px;color:var(--text);word-break:break-all}
  .viewer .vhead button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;
           padding:6px 12px;cursor:pointer;font-size:13px}
  .viewer iframe{flex:1;width:100%;height:78vh;border:0;background:#fff}
  footer{max-width:1080px;margin:0 auto 40px;padding:0 24px;color:var(--muted);font-size:12px}
  a.link{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>📂 CodeForFun · 单文件 HTML 目录</h1>
  <p>仓库内所有单文件 HTML 原型 / 组件集中预览。点击「预览」在站内打开，或「新标签打开」独立查看。</p>
</header>

<div class="bar">
  <input id="q" placeholder="搜索文件名 / 标题…" oninput="render()">
</div>
<div class="meta" id="meta">加载中…</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="viewer">
    <div class="vhead">
      <span id="vtitle">预览</span>
      <button onclick="closeViewer()">关闭 ✕</button>
    </div>
    <iframe id="vframe" src="about:blank"></iframe>
  </div>
</div>

<footer>
  数据来源：GitHub API（<a class="link" href="https://github.com/dengdasam/CodeForFun" target="_blank" rel="noopener">dengdasam/CodeForFun</a>）。
  本页自身不收录；新增 .html 文件会自动出现在列表中（需刷新）。
</footer>

<script>
const REPO = "dengdasam/CodeForFun";
const BRANCH = "main";
const API = `https://api.github.com/repos/${REPO}/contents?ref=${BRANCH}`;
// 离线 / CORS 失败时的兜底清单（与实际仓库保持一致）
const FALLBACK = [
  {name:"habanada-laibin-calendar.html", title:"哈巴纳达 · 来宾种植日历"},
  {name:"habanada-ningbo-calendar.html", title:"哈巴纳达 · 宁波种植日历"},
  {name:"数值输入框组件.html",            title:"数值输入框组件"}
];
const TITLE_MAP = {
  "habanada-laibin-calendar.html":"哈巴纳达 · 来宾种植日历",
  "habanada-ningbo-calendar.html":"哈巴纳达 · 宁波种植日历",
  "数值输入框组件.html":"数值输入框组件"
};
let DATA = [];

function humanize(name){
  if(TITLE_MAP[name]) return TITLE_MAP[name];
  return name.replace(/\.html?$/i,"").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function baseHref(name){ return encodeURIComponent(name); } // 同域 Pages 下相对路径

async function load(){
  try{
    const r = await fetch(API, {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const list = await r.json();
    DATA = (Array.isArray(list)?list:[])
      .filter(f => f.type==="file" && /\.html?$/i.test(f.name) && f.name.toLowerCase()!=="index.html")
      .map(f => ({name:f.name, title:TITLE_MAP[f.name]||humanize(f.name), size:f.size}));
    if(DATA.length===0) DATA = FALLBACK.map(f=>({...f,size:null}));
  }catch(e){
    DATA = FALLBACK.map(f=>({...f,size:null}));
  }
  document.getElementById("meta").textContent = `共 ${DATA.length} 个 HTML 文件`;
  render();
}

function render(){
  const q = (document.getElementById("q").value||"").toLowerCase();
  const grid = document.getElementById("grid");
  const items = DATA.filter(d => d.name.toLowerCase().includes(q) || d.title.toLowerCase().includes(q));
  if(items.length===0){ grid.innerHTML = `<div style="color:var(--muted)">没有匹配的文件</div>`; return; }
  grid.innerHTML = items.map(d=>{
    const href = baseHref(d.name);
    return `<div class="card">
      <div class="ico">📄</div>
      <h3>${d.title}</h3>
      <div class="fn">${d.name}${d.size?` · ${(d.size/1024).toFixed(1)} KB`:""}</div>
      <div class="acts">
        <a class="btn primary" href="${href}" target="_blank" rel="noopener">新标签打开</a>
        <button class="btn" onclick="openViewer('${href}','${d.title.replace(/'/g,"\\'")}')">预览</button>
      </div>
    </div>`;
  }).join("");
}

function openViewer(href,title){
  document.getElementById("vtitle").textContent = title;
  document.getElementById("vframe").src = href;
  document.getElementById("overlay").classList.add("show");
}
function closeViewer(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("vframe").src = "about:blank";
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeViewer(); });
load();
</script>
</body>
</html>

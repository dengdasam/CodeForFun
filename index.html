<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForFun · 单文件 HTML 目录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%239E5F68'/><stop offset='1' stop-color='%23C6A177'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50' y='70' font-size='50' text-anchor='middle'>🎉</text></svg>">
<style>
/* ===================== 设计令牌（低饱和暖调主题） ===================== */
:root{
  --bg:#faf6f0; --bg2:#fffdf9; --panel:#ffffff; --card:#f6f0e7; --line:#ebe3d6; --line2:#dcd0bc;
  --text:#33261f; --text2:#6b5c50; --muted:#a09283;
  --brand:#b0656e; --brand-deep:#8f4e57; --brand2:#b5834a;
  --brand-soft:#f7ecee; --brand-line:#e3c4c7; --brand2-soft:#f8efe2; --brand2-line:#e5d3b6;
  --grad:linear-gradient(125deg,#9E5F68 0%,#B47E68 50%,#C6A177 100%);
  --grad-btn:linear-gradient(135deg,#B4767D,#C08F63);
  --code-bg:#f4eee3;
  --shadow-s:0 1px 2px rgba(64,42,30,.06);
  --shadow-m:0 2px 6px rgba(64,42,30,.06), 0 12px 30px rgba(64,42,30,.1);
  --shadow-brand:0 6px 18px rgba(194,106,115,.28);
  --iframe-bg:#fff;
}
html[data-theme="dark"]{
  --bg:#1c1518; --bg2:#211a1e; --panel:#282024; --card:#2f262b; --line:#3a2f34; --line2:#4c3e44;
  --text:#f1e8e3; --text2:#c6b8b1; --muted:#8b7d77;
  --brand:#d9989f; --brand-deep:#ecb4b9; --brand2:#d9ae7d;
  --brand-soft:rgba(217,152,159,.11); --brand-line:rgba(217,152,159,.34);
  --brand2-soft:rgba(217,174,125,.11); --brand2-line:rgba(217,174,125,.32);
  --code-bg:#2c2428;
  --shadow-s:0 1px 2px rgba(0,0,0,.45);
  --shadow-m:0 4px 16px rgba(0,0,0,.45);
  --shadow-brand:0 6px 18px rgba(217,152,159,.18);
  --iframe-bg:#fff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
  transition:background .25s,color .25s;
}

/* ===================== 英雄区（渐变波浪横幅） ===================== */
.hero{
  position:relative;flex:0 0 auto;color:#fff;overflow:hidden;
  background:var(--grad);
  padding:22px 26px 52px;
}
/* 漂浮装饰光斑 */
.hero::before,.hero::after{
  content:"";position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);
}
.hero::before{width:340px;height:340px;top:-190px;right:-90px}
.hero::after{width:240px;height:240px;bottom:-140px;left:-70px;opacity:.5}
.hero-in{position:relative;z-index:2;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.logo{
  width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:27px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(4px);flex:none;box-shadow:0 6px 16px rgba(110,62,58,.22);
}
.hero .ttl{min-width:0;flex:1}
.hero h1{
  margin:0;font-size:25px;letter-spacing:.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 10px rgba(78,42,40,.3);
}
.hero h1 b{font-weight:800}
.hero h1 .dim{opacity:.75;font-weight:600}
/* 打字机 */
.typing{
  margin-top:6px;font-family:"Fira Code","Cascadia Code",Consolas,monospace;
  font-size:13.5px;min-height:20px;opacity:.96;text-shadow:0 1px 6px rgba(78,42,40,.28);
  white-space:nowrap;overflow:hidden;
}
.typing .cur{display:inline-block;width:8px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 徽章按钮墙 */
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;
  font-size:12px;font-weight:600;color:#fff;text-decoration:none;cursor:pointer;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);
  backdrop-filter:blur(3px);transition:.16s;user-select:none;
}
.badge:hover{background:rgba(255,255,255,.3);transform:translateY(-1px);box-shadow:0 4px 12px rgba(110,60,55,.25)}
.badge.solid{background:rgba(255,255,255,.92);color:#a84f5a;border-color:transparent}
.badge.solid:hover{background:#fff}
.badge .em{font-size:13px}

/* 统计（玻璃拟态） */
.hero .hact{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.stat{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.stat div{padding:6px 14px;font-size:10.5px;color:rgba(255,255,255,.92);line-height:1.35;text-align:center}
.stat div+div{border-left:1px solid rgba(255,255,255,.35)}
.stat b{display:block;font-size:16px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:#fff;
  text-decoration:none;backdrop-filter:blur(3px);transition:.16s;
}
.iconbtn:hover{background:rgba(255,255,255,.34);transform:translateY(-1px)}

/* 波浪层 */
.waves{position:absolute;left:0;right:0;bottom:-2px;height:42px;pointer-events:none;z-index:1}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:waveMove 16s linear infinite}
.waves svg.w2{animation-duration:26s;animation-direction:reverse;opacity:.45}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
html[data-theme="dark"] .waves .wf{fill:#1c1518}
html[data-theme="light"] .waves .wf{fill:#faf6f0}

/* ===================== 布局 ===================== */
.layout{flex:1 1 auto;display:grid;grid-template-columns:232px 1fr;min-height:0}

/* ---- 侧栏 ---- */
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.search{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.search .swrap{position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:9px 30px 9px 32px;border-radius:10px;font-size:13px;outline:none;transition:.15s;box-shadow:var(--shadow-s);
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search .sic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5}
.search .skbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--card);
}
.nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
.navsec{font-size:10.5px;letter-spacing:.18em;color:var(--muted);font-weight:600;margin:8px 8px 6px}
.navi{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;
  font-size:13px;color:var(--text2);transition:.13s;border:1px solid transparent;margin-bottom:2px;
}
.navi:hover{background:var(--card);color:var(--text)}
.navi.on{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand-line);font-weight:600}
.navi .ic{flex:none;width:22px;text-align:center;font-size:14px}
.navi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .n{
  flex:none;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums;min-width:20px;text-align:center;
}
.navi.on .n{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-deep)}
.hint{
  padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.65;border-top:1px solid var(--line);
}
.hint b{color:var(--text2)}
.hint code{background:var(--code-bg);padding:1px 5px;border-radius:4px;color:var(--brand-deep);font-size:10.5px}

/* ===================== 主区 ===================== */
.main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}

/* 文件信息条 */
.bar{
  flex:0 0 auto;padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  background:var(--bg2);
}
.bar .name{font-size:13.5px;color:var(--text2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .name b{color:var(--brand-deep)}
.bar .sp{flex:1}
.btn{
  padding:7px 13px;border-radius:9px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--text2);text-decoration:none;transition:.15s;white-space:nowrap;box-shadow:var(--shadow-s);
}
.btn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.btn.primary{background:var(--grad-btn);border-color:transparent;color:#fff;font-weight:600;box-shadow:var(--shadow-brand)}
.btn.primary:hover{filter:brightness(1.07);color:#fff}

/* 工具条 */
.toolbar{flex:0 0 auto;padding:9px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-s)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 13px;font-size:12.5px;cursor:pointer;transition:.14s}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--grad-btn);color:#fff;font-weight:600}
.toolbar .res{font-size:12px;color:var(--muted)}
.toolbar .sp{flex:1}
.toolbar label{font-size:12px;color:var(--muted)}
.toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 8px;font-size:12.5px;outline:none;box-shadow:var(--shadow-s)}
.toolbar select:focus{border-color:var(--brand)}

.stage{flex:1;display:flex;min-height:0}
.browse{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.browse.view-list .list{display:block}
.browse.view-list .grid{display:none}
.browse.view-grid .list{display:none}
.browse.view-grid .grid{display:grid}
.list{flex:1;overflow-y:auto;padding:10px 12px 20px}

/* 分组头 */
.grp{display:flex;align-items:baseline;gap:8px;margin:16px 4px 8px}
.grp:first-child{margin-top:4px}
.grp .gt{font-size:13px;font-weight:700;color:var(--text)}
.grp .gt .gi{margin-right:6px}
.grp .gn{font-size:11px;color:var(--muted)}
.grp .gl{flex:1;border-top:1px dashed var(--line2)}

/* 列表项 */
.item{
  padding:10px 12px;border-radius:11px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;
  border:1px solid transparent;transition:.15s;margin-bottom:3px;background:transparent;
}
.item:hover{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow-s)}
.item.active{background:var(--brand-soft);border-color:var(--brand-line);box-shadow:var(--shadow-s)}
.item .fi{
  flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--card);border:1px solid var(--line);
}
.item.active .fi{background:var(--grad);border-color:transparent;box-shadow:var(--shadow-s)}
.item .meta{min-width:0;flex:1}
.item .t{font-size:13.5px;line-height:1.4;color:var(--text);word-break:break-word;font-weight:500}
.item.active .t{color:var(--brand-deep)}
.item .f{font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all;font-variant-numeric:tabular-nums}
.item .go{
  flex:none;align-self:center;opacity:0;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--panel);transition:.15s;white-space:nowrap;
}
.item:hover .go{opacity:1}
.item .go:hover{color:var(--brand);border-color:var(--brand)}
.empty{color:var(--muted);text-align:center;padding:40px 12px;font-size:13px}

/* 加载骨架 */
.skl{padding:6px 4px}
.sk{height:52px;border-radius:11px;margin-bottom:6px;background:linear-gradient(90deg,var(--card) 25%,var(--panel) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* 网格缩略图 */
.grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;align-content:start}
.thumb{
  cursor:pointer;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);
  transition:.16s;display:flex;flex-direction:column;box-shadow:var(--shadow-s);position:relative;
}
.thumb:hover{border-color:var(--brand);box-shadow:var(--shadow-m);transform:translateY(-3px)}
.thumb.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft),var(--shadow-m)}
.thumb iframe{width:100%;height:158px;border:0;pointer-events:none;background:var(--iframe-bg);display:block}
.thumb .shim{
  position:absolute;top:0;left:0;right:0;height:158px;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  pointer-events:none;
}
.thumb .cap{padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.4;font-weight:500}
.thumb .cap .f{font-size:10.5px;color:var(--muted);margin-top:3px;word-break:break-all;font-weight:400;font-variant-numeric:tabular-nums}

/* 预览面板 */
.viewer{flex:0 0 44%;max-width:720px;min-height:0;background:var(--panel);display:none;flex-direction:column;border-left:1px solid var(--line)}
.viewer iframe{width:100%;height:100%;border:0;display:block;flex:1;background:var(--iframe-bg)}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px}
.placeholder .big{font-size:44px;opacity:.4;filter:grayscale(.3)}
.placeholder .tip{font-size:12px}

/* 放大弹窗 */
.modal{position:fixed;inset:0;background:rgba(28,21,24,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal-box{width:93vw;height:89vh;max-width:1150px;background:var(--panel);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal-head{flex:0 0 auto;padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.modal-head .mt{font-size:13.5px;color:var(--text2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-head .mt b{color:var(--brand-deep)}
.modal-head .sp{flex:1}
.modal-frame{flex:1;width:100%;border:0;display:block;background:var(--iframe-bg)}

/* ===================== 页脚（波浪） ===================== */
footer{flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--line)}
.footwave{display:block;width:100%;height:26px;margin-bottom:-1px}
.footwave .wf{fill:url(#footGrad)}
footer .ft{ text-align:center;color:var(--muted);font-size:11px;padding:0 10px 8px}
a.link{color:var(--brand);text-decoration:none}
a.link:hover{text-decoration:underline}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
  .stage{flex-direction:column}
  .viewer{border-left:none;border-top:1px solid var(--line);min-height:55vh;max-width:none;flex:1 1 55vh}
  .hero{padding:16px 18px 46px}
  .hero h1{font-size:20px}
  .hero .hact{margin-left:0;flex-direction:row;align-items:center}
  .badges{display:none}
  .stat div{padding:5px 9px}
  .item .go{display:none}
}
@media (prefers-reduced-motion: reduce){
  .waves svg{animation:none}
  .typing .cur{animation:none}
}
</style>
</head>
<body>

<!-- ============ 英雄区：渐变波浪横幅 ============ -->
<section class="hero">
  <div class="hero-in">
    <div class="logo">🎉</div>
    <div class="ttl">
      <h1>CodeForFun <span class="dim">· 单文件 HTML 目录</span></h1>
      <div class="typing"><span id="typed"></span><span class="cur">▌</span></div>
      <div class="badges">
        <a class="badge solid" href="https://github.com/dengdasam/CodeForFun" target="_blank" rel="noopener">
          <span class="em">⭐</span>GitHub 仓库</a>
        <span class="badge" onclick="jumpCat('研究')"><span class="em">📊</span>城市研究</span>
        <span class="badge" onclick="jumpCat('种植日历')"><span class="em">🌱</span>种植日历</span>
        <span class="badge" onclick="jumpCat('根目录')"><span class="em">💰</span>公积金 · 投资</span>
        <span class="badge" onclick="setView('grid')"><span class="em">▦</span>缩略图模式</span>
      </div>
    </div>
    <div class="hact">
      <div class="stat">
        <div><b id="stFiles">–</b>卡片</div>
        <div><b id="stCats">–</b>分类</div>
        <div><b id="stUpd">–</b>最近更新</div>
      </div>
      <button class="iconbtn" id="themeBtn" onclick="cycleTheme()" title="切换深色 / 浅色">🌗</button>
    </div>
  </div>
  <div class="waves" aria-hidden="true">
    <svg class="w1" viewBox="0 0 2400 42" preserveAspectRatio="none">
      <path class="wf" d="M0,26 C200,44 400,6 600,24 C800,42 1000,8 1200,24 C1400,40 1600,6 1800,24 C2000,42 2200,8 2400,24 L2400,42 L0,42 Z"/>
    </svg>
    <svg class="w2" viewBox="0 0 2400 42" preserveAspectRatio="none">
      <path class="wf" d="M0,30 C150,14 350,44 600,28 C850,12 1050,42 1200,28 C1350,14 1550,44 1800,28 C2050,12 2250,42 2400,28 L2400,42 L0,42 Z"/>
    </svg>
  </div>
</section>

<div class="layout">
  <aside class="sidebar">
    <div class="search">
      <div class="swrap">
        <span class="sic">🔍</span>
        <input id="q" placeholder="搜索标题 / 文件名…" oninput="render()">
        <span class="skbd">/</span>
      </div>
    </div>
    <nav class="nav">
      <div class="navsec">分类</div>
      <div id="cats"></div>
    </nav>
    <div class="hint">
      分类按文件所在<b>真实子目录</b>自动生成。点击卡片在右侧预览，「⛶ 放大」全屏查看。按 <code>/</code> 聚焦搜索，<code>Esc</code> 关闭弹窗。新增 .html 会自动出现。
    </div>
  </aside>

  <section class="main">
    <div class="bar">
      <div class="name" id="barName">未选择文件</div>
      <div class="sp"></div>
      <button class="btn" id="zoomBtn" onclick="zoomActive()" style="display:none">⛶ 放大</button>
      <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" style="display:none">↗ 新标签</a>
      <button class="btn primary" id="closeBtn" onclick="closePreview()" style="display:none">关闭预览</button>
    </div>
    <div class="toolbar">
      <div class="seg">
        <button data-v="list" class="on" onclick="setView('list')">⊞ 列表</button>
        <button data-v="grid" onclick="setView('grid')">▦ 缩略图</button>
      </div>
      <div class="res" id="res"></div>
      <div class="sp"></div>
      <label for="sort">排序</label>
      <select id="sort" onchange="setSort(this.value)">
        <option value="name">名称</option>
        <option value="time">最近更新</option>
      </select>
    </div>
    <div class="stage">
      <div class="browse view-list" id="browse">
        <div class="list" id="listView"><div class="skl"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="viewer" id="viewer">
        <div class="placeholder" id="ph">
          <div class="big">🗂️</div>

  {path:"研究/宁波养老金测算.html", title:"落户宁波的养老金测算 v13 · 脱敏版"}
];
const TITLE_MAP = {
  "比莱洛20条投资法则精读.html":"查理·比莱洛《20条市场与投资法则》精读",
  "雪花WMS校验与告警规范.html":"雪花WMS 系统校验与告警规范 V1.0",
  "公积金缴存基数上下限20城.html":"前20城住房公积金缴存基数上下限 · 2026年度对比",
  "公积金缴存额20城.html":"2025年度全国公积金缴存额前20城 · 归集总额与人均额度",
  "公积金缴存人数覆盖率20城.html":"前20城公积金缴存人数 vs 常住人口 vs 适龄劳动人数",
  "公积金贷款2026年度20城.html":"各城市住房公积金2026年度对比",
  "公积金全景总卡20城.html":"前20城住房公积金全景总卡 · 六维度整合",
  "公积金购房支撑力20城.html":"前20城公积金购房支撑力 · 贷款额度 ÷ 房价",
  "公积金个贷率20城.html":"前20城住房公积金资金使用效率 · 个贷率",
  "哈巴纳达广西来宾种植日历.html":"哈巴纳达 · 广西来宾全年种植日历",
  "哈巴纳达浙江宁波种植日历.html":"哈巴纳达 · 浙江宁波全年种植日历",
  "数值输入框组件.html":"Vue 数值输入框组件（带计算器弹窗）",
  "北海两居室选房推荐.html":"北海买两居 · 选房推荐卡",
  "北海对比宁波春晓梅山.html":"广西北海 vs 宁波春晓/梅山 · 沿海旅居深度对比",
  "四城人口结构与房价验证.html":"四城人口结构 vs 房价见底验证",
  "沿海旅居决策合集.html":"沿海旅居决策合集 · 六城对比",
  "城经笔记竞品对标卡.html":"城市经济号竞品对标卡",
  "竞品深度拆解.html":"竞品深度拆解 · 城经笔记 vs 三土 / 国民经略",
  "哈巴纳达食用指南.html":"哈巴纳达食用指南 · 0辣度哈瓦那甜椒",
  "哈拉佩纽品种图鉴.html":"哈拉佩纽 Jalapeño · 品种图鉴与产量",
  "宁波养老金测算.html":"落户宁波的养老金测算 v13 · 脱敏版"
};
const CAT_ICON = { "研究":"📊", "种植日历":"🌱", "组件":"🧩", "根目录":"📌" };
const CAT_LABEL = { "种植日历":"种植日历", "组件":"组件", "根目录":"根目录", "研究":"研究" };
/* 卡片图标：按内容关键词 */
const EMOJI_RULES = [
  [/公积金|养老金|缴存|个贷/, "💰"],
  [/辣椒|哈巴纳达|哈拉佩纽|种植|日历/, "🌱"],
  [/旅居|北海|沿海|春晓|房价|买房|两居/, "🌊"],
  [/竞品|城经|对标|拆解|比莱洛|投资法则/, "📈"],
  [/人口/, "👥"],
  [/WMS|校验|告警|规范/, "🏭"],
  [/输入框|组件/, "🧩"]
];
let DATA = [];
let active = null;
let view = "list";
let sort = "name";
let catFilter = "all";
let viewerClosed = true;

/* ===================== 打字机 ===================== */
const TYPE_LINES = [
  "单文件 HTML · 零依赖 · 即开即用",
  "城市研究 · 数据分析卡 · 种植日历",
  "公积金 20 城 · 沿海旅居 · 辣椒图鉴",
  "Code is for Fun ✨"
];
let tIdx = 0, tPos = 0, tDeleting = false;
const typedEl = document.getElementById("typed");
function typeTick(){
  const line = TYPE_LINES[tIdx];
  if(!tDeleting){
    tPos++;
    typedEl.textContent = line.slice(0, tPos);
    if(tPos >= line.length){
      tDeleting = true;
      setTimeout(typeTick, 2100);   // 停留
      return;
    }
    setTimeout(typeTick, 62);
  }else{
    tPos--;
    typedEl.textContent = line.slice(0, tPos);
    if(tPos <= 0){
      tDeleting = false;
      tIdx = (tIdx + 1) % TYPE_LINES.length;
      setTimeout(typeTick, 420);
      return;
    }
    setTimeout(typeTick, 26);
  }
}
typeTick();

/* ===================== 工具 ===================== */
function baseName(p){ return p.split("/").pop(); }
function humanize(name){
  if(TITLE_MAP[name]) return TITLE_MAP[name];
  return name.replace(/\.html?$/i,"").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function enc(p){ return encodeURIComponent(p); }
function pathEnc(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function catOf(path){ return path.includes("/") ? path.split("/").slice(0,-1).join("/") : "根目录"; }
function fileEmoji(d){
  const s = d.title + " " + d.name;
  for(const [re, ic] of EMOJI_RULES) if(re.test(s)) return ic;
  return "📄";
}
function esc2(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rel(iso){
  if(!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const day = 86400000;
  if(diff < day) return "今天";
  if(diff < day*30) return Math.floor(diff/day) + " 天前";
  if(diff < day*365) return Math.floor(diff/(day*30)) + " 个月前";
  return iso.slice(0,10);
}

/* ===================== 主题 ===================== */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "🌙" : "☀️";
  try{ localStorage.setItem("cff-theme", t); }catch(e){}
}
function initTheme(){
  let t = null;
  try{ t = localStorage.getItem("cff-theme"); }catch(e){}
  if(!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyTheme(t);
}
function cycleTheme(){
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}
initTheme();

/* ===================== 数据加载 ===================== */
async function fetchTime(path){
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${enc(path)}&per_page=1`,
      {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) return null;
    const j = await r.json();
    return j[0]?.commit?.committer?.date || j[0]?.commit?.author?.date || null;
  }catch(e){ return null; }
}
async function load(){
  try{
    const r = await fetch(TREE_API, {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const blobs = (j.tree||[]).filter(n => n.type==="blob" && /\.html?$/i.test(n.path) && SKIP.indexOf(baseName(n.path).toLowerCase()) === -1);
    DATA = blobs.map(b=>{
      const name = baseName(b.path);
      return {path:b.path, name, title:TITLE_MAP[name]||humanize(name), size:b.size, cat:catOf(b.path), updated:null};
    });
    if(DATA.length===0) DATA = FALLBACK.map(f=>({...f, name:baseName(f.path), size:null, cat:catOf(f.path), updated:null}));
  }catch(e){ DATA = FALLBACK.map(f=>({...f, name:baseName(f.path), size:null, cat:catOf(f.path), updated:null})); }

  await Promise.all(DATA.map(d => fetchTime(d.path).then(t => d.updated = t)));

  const cats = new Set(DATA.map(d=>d.cat));
  document.getElementById("stFiles").textContent = DATA.length;
  document.getElementById("stCats").textContent = cats.size;
  const upd = DATA.map(d=>d.updated).filter(Boolean).sort().pop();
  document.getElementById("stUpd").textContent = upd ? rel(upd) : "–";
  renderCats();
  render();
}

/* ===================== 渲染 ===================== */
function renderCats(){
  const counts = {};
  DATA.forEach(d=>{ counts[d.cat] = (counts[d.cat]||0)+1; });
  const cats = ["all", ...Array.from(new Set(DATA.map(d=>d.cat)))];
  const label = c => c==="all" ? "全部" : (CAT_LABEL[c] || c);
  const icon = c => c==="all" ? "🗂️" : (CAT_ICON[c] || "📄");
  document.getElementById("cats").innerHTML = cats.map(c=>
    `<div class="navi ${catFilter===c?'on':''}" onclick="setCat('${esc2(c)}')">
       <span class="ic">${icon(c)}</span><span class="nm">${label(c)}</span>
       <span class="n">${c==="all"?DATA.length:counts[c]}</span>
     </div>`).join("");
}
function setCat(c){ catFilter = c; renderCats(); render(); }
function jumpCat(c){ setCat(c); document.querySelector(".stage").scrollIntoView({behavior:"smooth"}); }
function setView(v){ view = v; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); render(); }
function setSort(v){ sort = v; render(); }

function visibleItems(){
  const q = (document.getElementById("q").value||"").toLowerCase();
  let items = DATA.filter(d =>
    (catFilter==="all" || d.cat===catFilter) &&
    (d.name.toLowerCase().includes(q) || d.title.toLowerCase().includes(q)));
  items.sort((a,b)=>{
    if(sort==="time"){
      if(!a.updated) return 1; if(!b.updated) return -1;
      return new Date(b.updated) - new Date(a.updated);
    }
    return a.title.localeCompare(b.title, "zh");
  });
  return items;
}

function itemHTML(d, grouped){
  return `
    <div class="item ${active===d.path?'active':''}" onclick="openFile('${enc(d.path)}')">
      <div class="fi">${fileEmoji(d)}</div>
      <div class="meta">
        <div class="t">${d.title}</div>
        <div class="f">${d.path}${d.size?` · ${(d.size/1024).toFixed(1)} KB`:""}${d.updated?` · ${rel(d.updated)}`:""}</div>
      </div>
      <span class="go" onclick="event.stopPropagation();openRaw('${enc(d.path)}')">↗ 打开</span>
    </div>`;
}

function render(){
  const items = visibleItems();
  const listEl = document.getElementById("listView");
  const gridEl = document.getElementById("grid");
  document.getElementById("res").textContent = items.length + " / " + DATA.length + " 项";

  if(items.length===0){
    const msg = `<div class="empty">没有匹配的文件</div>`;
    listEl.innerHTML = msg; gridEl.innerHTML = "";
    document.getElementById("browse").className = "browse " + (view==="grid"?"view-grid":"view-list");
    return;
  }

  /* 列表视图：全部分类时按目录分组；否则平铺 */
  let listHTML = "";
  if(catFilter==="all" && sort!=="time"){
    const byCat = {};
    items.forEach(d=>{ (byCat[d.cat] = byCat[d.cat]||[]).push(d); });
    for(const c of Object.keys(byCat)){
      listHTML += `<div class="grp"><span class="gt"><span class="gi">${CAT_ICON[c]||"📄"}</span>${CAT_LABEL[c]||c}</span>
        <span class="gn">${byCat[c].length} 张</span><span class="gl"></span></div>`;
      listHTML += byCat[c].map(d=>itemHTML(d)).join("");
    }
  }else{
    listHTML = items.map(d=>itemHTML(d)).join("");
  }

  const gridHTML = items.map(d=>`
    <div class="thumb ${active===d.path?'active':''}" onclick="openModal('${enc(d.path)}')">
      <iframe src="${pathEnc(d.path)}" loading="lazy" title="${esc2(d.title)}" tabindex="-1"></iframe>
      <div class="shim"></div>
      <div class="cap">
        <div class="t">${fileEmoji(d)} ${d.title}</div>
        <div class="f">${d.path}${d.updated?` · ${rel(d.updated)}`:""}</div>
      </div>
    </div>`).join("");

  listEl.innerHTML = listHTML;
  gridEl.innerHTML = gridHTML;
  document.getElementById("browse").className = "browse " + (view==="grid"?"view-grid":"view-list");
}

/* ===================== 预览 ===================== */
function openRaw(href){ window.open(pathEnc(decodeURIComponent(href)), "_blank"); }
function openFile(href){
  active = decodeURIComponent(href);
  const d = DATA.find(x=>x.path===active);
  document.getElementById("barName").innerHTML = `当前：<b>${d?d.title:active}</b>`;
  document.getElementById("openBtn").href = pathEnc(active);
  document.getElementById("openBtn").style.display = "";
  document.getElementById("closeBtn").style.display = "";
  document.getElementById("zoomBtn").style.display = "";
  if(viewerClosed) toggleViewer();
  document.getElementById("ph").style.display = "none";
  const f = document.getElementById("frame");
  f.style.display = "block"; f.src = pathEnc(active);
  render();
}
function closePreview(){
  document.getElementById("ph").style.display = "flex";
  const f = document.getElementById("frame");
  f.style.display = "none"; f.src = "about:blank";
  toggleViewer();
  document.getElementById("barName").textContent = "未选择文件";
  document.getElementById("openBtn").style.display = "none";
  document.getElementById("closeBtn").style.display = "none";
  document.getElementById("zoomBtn").style.display = "none";
  active = null;
  render();
}
function toggleViewer(){
  viewerClosed = !viewerClosed;
  const v = document.getElementById("viewer");
  v.style.display = viewerClosed ? "none" : "flex";
}

/* ===================== 弹窗 ===================== */
function openModal(href){
  const path = decodeURIComponent(href);
  const d = DATA.find(x=>x.path===path);
  document.getElementById("mTitle").innerHTML = `预览：<b>${d?d.title:path}</b>`;
  document.getElementById("mOpen").href = pathEnc(path);
  document.getElementById("mFrame").src = pathEnc(path);
  document.getElementById("modal").classList.add("show");
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.getElementById("mFrame").src = "about:blank";
}
function zoomActive(){ if(!active) return; openModal(encodeURIComponent(active)); }

/* ===================== 快捷键 ===================== */
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="/" && document.activeElement !== document.getElementById("q")){
    e.preventDefault();
    document.getElementById("q").focus();
  }
});

load();
</script>

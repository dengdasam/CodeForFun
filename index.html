<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForFun · 单文件 HTML 目录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%233B5A6A'/><rect x='28' y='28' width='44' height='44' rx='6' fill='%23FFFFFF'/></svg>">
<style>
:root{
  --bg:#F7F9FA; --paper:#FFFFFF; --ink:#22272B; --ink2:#66727B; --ink3:#94A0A8;
  --line:#E2E7EB; --line2:#EDF0F3; --code:#F5F7F9;
  --accent:#3B5A6A; --accent-soft:#EAF0F3; --accent-line:#C9D6DE;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#171B1E; --paper:#20262A; --ink:#E6EAEC; --ink2:#A7B3BA; --ink3:#7C8A92;
  --line:#333C42; --line2:#2A3237; --code:#242C31;
  --accent:#8FB2C4; --accent-soft:#25343C; --accent-line:#3E5663;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.topbar{flex:0 0 auto;height:58px;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 22px}
.topbar .lead{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .sq{width:22px;height:22px;border-radius:5px;background:var(--accent);flex:none}
.topbar .t{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.topbar .s{font-size:11.5px;color:var(--ink3);white-space:nowrap;margin-left:2px}
.topbar .sp{flex:1}
.counts{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.counts b{font-size:15px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;margin-right:3px}
.topbar .act{display:flex;align-items:center;gap:8px}

button,.btn{font:inherit;font-size:11.5px;padding:5px 11px;border:1px solid var(--line);border-radius:5px;
  background:var(--paper);color:var(--ink2);cursor:pointer;white-space:nowrap;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;transition:border-color .15s,color .15s,background .15s}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);text-decoration:none}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent);color:#fff;opacity:.88}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:238px minmax(0,1fr)}
.sidebar{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;overflow-y:auto;padding:18px 14px 20px}
.search{margin-bottom:20px}
.search input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:5px;
  color:var(--ink);padding:8px 10px;font-size:12.5px;outline:none;font-family:var(--sans)}
.search input::placeholder{color:var(--ink3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:7px;display:block}
.kbd code{background:var(--code);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink2)}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink3);margin:0 0 9px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.navi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:4px;cursor:pointer;
  font-size:12.5px;color:var(--ink2);border-left:2px solid transparent;transition:background .15s,color .15s}
.navi:hover{background:var(--bg);color:var(--accent)}
.navi.on{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.navi .ic{flex:none;width:16px;text-align:center;font-size:12px}
.navi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .n{flex:none;font-size:11px;color:var(--ink3);background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:0 6px;line-height:17px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.navi.on .n{background:var(--paper);border-color:var(--accent-line);color:var(--accent)}
.side-rule{height:1px;background:var(--line);margin:20px 0 16px}
.side-block{margin-bottom:18px}
.side-block .k{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink3);margin:0 0 8px 4px}
.side-block .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:3px 4px}
.side-block .row b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.side-status{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:5px;
  padding:9px 11px;font-size:11.5px;color:var(--accent);line-height:1.6;margin-bottom:16px}
.side-foot{margin-top:auto;font-size:11px;color:var(--ink3);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}

.content{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.bar{flex:0 0 auto;padding:9px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  background:var(--paper);min-height:48px}
.bar .name{font-size:12.5px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{flex:1}
.toolbar{flex:0 0 auto;padding:9px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--paper)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on:hover{background:var(--accent);color:#fff}
.toolbar .res{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.toolbar .sp{flex:1}
.toolbar label{font-size:11.5px;color:var(--ink3)}
select{font:inherit;font-size:11.5px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;
  background:var(--paper);color:var(--ink2);outline:none}
select:focus{border-color:var(--accent)}

.stage{flex:1;min-height:0;display:flex}
.browse{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.browse.view-list .list{display:block}
.browse.view-list .grid{display:none}
.browse.view-grid .list{display:none}
.browse.view-grid .grid{display:grid}
.list{flex:1;overflow-y:auto;padding:16px 22px 30px}
.grp{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.grp:first-child{margin-top:2px}
.grp .gt{font-size:12px;font-weight:600;color:var(--ink)}
.grp .gt .gi{font-size:12px;margin-right:5px}
.grp .gn{font-size:11px;color:var(--ink3)}
.grp .gl{flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:10px 13px;background:var(--paper);
  border:1px solid var(--line);border-radius:5px;margin-bottom:6px;cursor:pointer;
  transition:border-color .15s,background .15s}
.item:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.item.active{border-color:var(--accent);background:var(--accent-soft)}
.item .fi{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:4px;
  background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px}
.item.active .fi{background:var(--paper);border-color:var(--accent-line)}
.item .meta{flex:1;min-width:0}
.item .t{font-size:12.5px;font-weight:500;color:var(--ink);word-break:break-word}
.item .f{font-size:11px;color:var(--ink3);margin-top:2px;word-break:break-all;font-variant-numeric:tabular-nums}
.item .go{flex:none;font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;
  padding:2px 8px;background:var(--paper);opacity:0}
.item:hover .go{opacity:1}
.item .go:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--ink3);text-align:center;padding:40px 12px;font-size:12.5px}
.skl{padding:4px 0}
.sk{height:46px;border-radius:5px;margin-bottom:6px;background:var(--line2)}

.grid{flex:1;overflow-y:auto;padding:16px 22px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-content:start}
.thumb{cursor:pointer;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--paper);
  display:flex;flex-direction:column;transition:border-color .15s}
.thumb:hover{border-color:var(--accent)}
.thumb.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line)}
.thumb iframe{width:100%;height:150px;border:0;pointer-events:none;background:#fff;display:block}
.thumb .cap{padding:9px 11px;border-top:1px solid var(--line);font-size:12px;line-height:1.45}
.thumb .cap .f{font-size:10.5px;color:var(--ink3);margin-top:3px;word-break:break-all;font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;background:rgba(23,27,30,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal-box{width:92vw;height:88vh;max-width:1180px;background:var(--paper);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{flex:0 0 auto;padding:10px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--paper)}
.modal-head .mt{font-size:12.5px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-head .sp{flex:1}
.modal-frame{flex:1;width:100%;border:0;display:block;background:var(--paper)}

footer{flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);padding:7px 22px;
  font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--accent-line);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .sidebar{max-height:32vh;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px}
  .side-rule,.side-block,.side-status,.side-foot,.search .kbd{display:none}
  .search{margin-bottom:10px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .navi{border-left:none;border-bottom:2px solid transparent}
  .navi.on{border-left:none;border-bottom-color:var(--accent)}
  .topbar{padding:0 14px;height:auto;min-height:54px;flex-wrap:wrap;gap:10px}
  .topbar .s,.counts{display:none}
  .bar,.toolbar{padding-left:14px;padding-right:14px}
  .list,.grid{padding-left:14px;padding-right:14px}
  .item .go{display:none}
  footer{padding:6px 14px}
}
@media print{.topbar,.sidebar,.bar,.toolbar,.modal,footer{display:none!important}.layout{display:block}}
</style>
</head>
<body>

<main class="content">

</div>
<div class="toolbar">
<div class="seg">

<div class="res" id="res"></div>
<div class="sp"></div>

</div>
<div class="stage">
<div class="browse view-list" id="browse">

<div class="grid" id="grid"></div>

</div>
</main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">

<div class="modal-head">
<div class="mt" id="mTitle">预览</div>
<div class="sp"></div>
<a class="btn" id="mOpen" href="#" target="_blank" rel="noopener">新标签打开</a>
<button class="btn primary" onclick="closeModal()">关闭</button>
</div>
<iframe class="modal-frame" id="mFrame" src="about:blank" title="内容预览"></iframe>
</div>
</div>

<footer>

  "数值输入框组件.html":"Vue 数值输入框组件（带计算器弹窗）",
  "北海两居室选房推荐.html":"北海买两居 · 选房推荐卡",
  "北海对比宁波春晓梅山.html":"广西北海 vs 宁波春晓/梅山 · 沿海旅居深度对比",
  "四城人口结构与房价验证.html":"四城人口结构 vs 房价见底验证",
  "沿海旅居决策合集.html":"沿海旅居决策合集 · 六城对比",
  "城经笔记竞品对标卡.html":"城市经济号竞品对标卡",
  "竞品深度拆解.html":"竞品深度拆解 · 城经笔记 vs 三土 / 国民经略",
  "哈巴纳达食用指南.html":"哈巴纳达食用指南 · 0辣度哈瓦那甜椒",
  "哈拉佩纽品种图鉴.html":"哈拉佩纽 Jalapeño · 品种图鉴与产量",
  "宁波养老金测算.html":"落户宁波的养老金测算 v13 · 脱敏版",
  "宁波十区县落户定居对比.html":"宁波十区县落户定居全景对比 · 2025官方数据 × 2026房价",
  "东京大学数学入试_1949-1950_中文译本.html":"东京大学数学入学考试 1949–1950 · 中文译本",
  "东京大学数学入试_1951-1954_中文译本.html":"东京大学数学入学考试 1951–1954 · 中文译本",
  "2025年省份与城市财政收入混排榜.html":"2025年省份与城市财政收入混排榜 · 99行 × 人口/GDP/财政"
};
const CAT_ICON = { "研究":"📊", "种植日历":"🌱", "组件":"🧩", "根目录":"📌", "数学":"📐" };
const CAT_LABEL = { "种植日历":"种植日历", "组件":"组件", "根目录":"根目录", "研究":"研究", "数学":"数学" };
/* 卡片图标：按内容关键词 */
const EMOJI_RULES = [
  [/混排榜|省份与城市/, "📊"],
  [/公积金|养老金|缴存|个贷/, "💰"],
  [/辣椒|哈巴纳达|哈拉佩纽|种植|日历/, "🌱"],
  [/旅居|北海|沿海|春晓|房价|买房|两居/, "🌊"],
  [/竞品|城经|对标|拆解|比莱洛|投资法则/, "📈"],
  [/人口/, "👥"],
  [/宁波|落户|区县|定居|财政/, "🏙️"],
  [/WMS|校验|告警|规范/, "🏭"],
  [/输入框|组件/, "🧩"],
  [/东京大学|入试|数学|试题/, "📐"]
];
let DATA = [];
let active = null;
let view = "list";
let sort = "name";
let catFilter = "all";

/* ===================== 工具 ===================== */
function baseName(p){ return p.split("/").pop(); }
function humanize(name){
  if(TITLE_MAP[name]) return TITLE_MAP[name];
  return name.replace(/\.html?$/i,"").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function enc(p){ return encodeURIComponent(p); }
function pathEnc(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function catOf(path){ return path.includes("/") ? path.split("/").slice(0,-1).join("/") : "根目录"; }
function fileEmoji(d){
  const s = d.title + " " + d.name;
  for(const [re, ic] of EMOJI_RULES) if(re.test(s)) return ic;
  return "·";
}
function esc2(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rel(iso){
  if(!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const day = 86400000;
  if(diff < day) return "今天";
  if(diff < day*30) return Math.floor(diff/day) + " 天前";
  if(diff < day*365) return Math.floor(diff/(day*30)) + " 个月前";
  return iso.slice(0,10);
}

/* ===================== 主题 ===================== */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "深色" : "浅色";
  try{ localStorage.setItem("cff-theme", t); }catch(e){}
}
function initTheme(){
  let t = null;
  try{ t = localStorage.getItem("cff-theme"); }catch(e){}
  if(!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyTheme(t);
}
function cycleTheme(){
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}
initTheme();

/* ===================== 数据加载 ===================== */
async function fetchTime(path){
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${enc(path)}&per_page=1`,
      {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) return null;
    const j = await r.json();
    return j[0]?.commit?.committer?.date || j[0]?.commit?.author?.date || null;
  }catch(e){ return null; }
}
async function load(){
  try{
    const r = await fetch(TREE_API, {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const blobs = (j.tree||[]).filter(n => n.type==="blob" && /\.html?$/i.test(n.path) && SKIP.indexOf(baseName(n.path).toLowerCase()) === -1);
    DATA = blobs.map(b=>{
      const name = baseName(b.path);
      return {path:b.path, name, title:TITLE_MAP[name]||humanize(name), size:b.size, cat:catOf(b.path), updated:null};
    });
    if(DATA.length===0) DATA = FALLBACK.map(f=>({...f, name:baseName(f.path), size:null, cat:catOf(f.path), updated:null}));
  }catch(e){ DATA = FALLBACK.map(f=>({...f, name:baseName(f.path), size:null, cat:catOf(f.path), updated:null})); }

  await Promise.all(DATA.map(d => fetchTime(d.path).then(t => d.updated = t)));

  const cats = new Set(DATA.map(d=>d.cat));
  const n = DATA.length, c = cats.size;
  const upd = DATA.map(d=>d.updated).filter(Boolean).sort().pop();
  const u = upd ? rel(upd) : "–";
  document.getElementById("stFiles").textContent = n;
  document.getElementById("stCats").textContent = c;
  document.getElementById("stUpd").textContent = u;
  document.getElementById("sideFiles").textContent = n;
  document.getElementById("sideCats").textContent = c;
  document.getElementById("sideUpd").textContent = u;
  renderCats();
  render();
}

/* ===================== 渲染 ===================== */
function renderCats(){
  const counts = {};
  DATA.forEach(d=>{ counts[d.cat] = (counts[d.cat]||0)+1; });
  const cats = ["all", ...Array.from(new Set(DATA.map(d=>d.cat)))];
  const label = c => c==="all" ? "全部" : (CAT_LABEL[c] || c);
  const icon = c => c==="all" ? "·" : (CAT_ICON[c] || "·");
  document.getElementById("cats").innerHTML = cats.map(c=>
    `<div class="navi ${catFilter===c?'on':''}" onclick="setCat('${esc2(c)}')">
       <span class="ic">${icon(c)}</span><span class="nm">${label(c)}</span>
       <span class="n">${c==="all"?DATA.length:counts[c]}</span>
     </div>`).join("");
}
function setCat(c){ catFilter = c; renderCats(); render(); }
function jumpCat(c){ setCat(c); document.getElementById("browse").scrollIntoView({behavior:"smooth"}); }
function setView(v){ view = v; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); render(); }
function setSort(v){ sort = v; render(); }

function visibleItems(){
  const q = (document.getElementById("q").value||"").toLowerCase();
  let items = DATA.filter(d =>
    (catFilter==="all" || d.cat===catFilter) &&
    (d.name.toLowerCase().includes(q) || d.title.toLowerCase().includes(q)));
  items.sort((a,b)=>{
    if(sort==="time"){
      if(!a.updated) return 1; if(!b.updated) return -1;
      return new Date(b.updated) - new Date(a.updated);
    }
    return a.title.localeCompare(b.title, "zh");
  });
  return items;
}

function itemHTML(d){
  return `
    <div class="item ${active===d.path?'active':''}" onclick="openFile('${enc(d.path)}')">
      <div class="fi">${fileEmoji(d)}</div>
      <div class="meta">
        <div class="t">${d.title}</div>
        <div class="f">${d.path}${d.size?` · ${(d.size/1024).toFixed(1)} KB`:""}${d.updated?` · ${rel(d.updated)}`:""}</div>
      </div>
      <span class="go" onclick="event.stopPropagation();openRaw('${enc(d.path)}')">打开</span>
    </div>`;
}

function render(){
  const items = visibleItems();
  const listEl = document.getElementById("listView");
  const gridEl = document.getElementById("grid");
  document.getElementById("res").textContent = items.length + " / " + DATA.length + " 项";

  if(items.length===0){
    const msg = `<div class="empty">没有匹配的文件</div>`;
    listEl.innerHTML = msg; gridEl.innerHTML = "";
    document.getElementById("browse").className = "browse " + (view==="grid"?"view-grid":"view-list");
    return;
  }

  let listHTML = "";
  if(catFilter==="all" && sort!=="time"){
    const byCat = {};
    items.forEach(d=>{ (byCat[d.cat] = byCat[d.cat]||[]).push(d); });
    for(const c of Object.keys(byCat)){
      listHTML += `<div class="grp"><span class="gt"><span class="gi">${CAT_ICON[c]||"·"}</span>${CAT_LABEL[c]||c}</span>
        <span class="gn">${byCat[c].length} 张</span><span class="gl"></span></div>`;
      listHTML += byCat[c].map(d=>itemHTML(d)).join("");
    }
  }else{
    listHTML = items.map(d=>itemHTML(d)).join("");
  }

  const gridHTML = items.map(d=>`
    <div class="thumb ${active===d.path?'active':''}" onclick="openFile('${enc(d.path)}')">
      <iframe src="${pathEnc(d.path)}" loading="lazy" title="${esc2(d.title)}" tabindex="-1"></iframe>
      <div class="cap">
        <div class="t">${fileEmoji(d)} ${d.title}</div>
        <div class="f">${d.path}${d.updated?` · ${rel(d.updated)}`:""}</div>
      </div>
    </div>`).join("");

  listEl.innerHTML = listHTML;
  gridEl.innerHTML = gridHTML;
  document.getElementById("browse").className = "browse " + (view==="grid"?"view-grid":"view-list");
}

/* ===================== 预览（点击弹窗） ===================== */
function openRaw(href){ window.open(pathEnc(decodeURIComponent(href)), "_blank"); }
function openFile(href){
  active = decodeURIComponent(href);
  const d = DATA.find(x=>x.path===active);
  document.getElementById("barName").textContent = "当前：" + (d?d.title:active);
  document.getElementById("openBtn").href = pathEnc(active);
  document.getElementById("openBtn").style.display = "";
  document.getElementById("zoomBtn").style.display = "";
  document.getElementById("clearBtn").style.display = "";
  openModal(encodeURIComponent(active));
  render();
}
function clearActive(){
  active = null;
  document.getElementById("barName").textContent = "未选择文件";
  document.getElementById("openBtn").style.display = "none";
  document.getElementById("zoomBtn").style.display = "none";
  document.getElementById("clearBtn").style.display = "none";
  render();
}
function openModal(href){
  const path = decodeURIComponent(href);
  const d = DATA.find(x=>x.path===path);
  document.getElementById("mTitle").textContent = "预览 · " + (d?d.title:path);
  document.getElementById("mOpen").href = pathEnc(path);
  document.getElementById("mFrame").src = pathEnc(path);
  document.getElementById("modal").classList.add("show");
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.getElementById("mFrame").src = "about:blank";
}
function zoomActive(){ if(!active) return; openModal(encodeURIComponent(active)); }

/* ===================== 快捷键 ===================== */
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="/" && document.activeElement !== document.getElementById("q")){
    e.preventDefault();
    document.getElementById("q").focus();
  }
});

load();
</script>
</body>
</html>
